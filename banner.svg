<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mariana Guzmán — Archivo, Gestión Documental, Datos" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Mariana Guzmán — Archivo, Gestión Documental, Datos</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- luces difuminadas que se ven a través del vidrio -->
    <circle cx="170" cy="60" r="130" fill="#22d3ee" opacity="0.45" filter="url(#blur)"/>
    <circle cx="1020" cy="285" r="150" fill="#8b5cf6" opacity="0.55" filter="url(#blur)"/>
    <circle cx="640" cy="-10" r="110" fill="#f472b6" opacity="0.30" filter="url(#blur)"/>

    <!-- panel de vidrio -->
    <rect x="36" y="36" width="1128" height="248" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- texto -->
    <text x="84" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#name)">Mariana Guzmán</text>
    <text x="86" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#cbd5e1">Archivista · Gestión documental · Datos</text>

    <!-- pastillas -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">
      <rect x="86" y="208" width="172" height="40" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="172" y="233">Archivo jurídico</text>
      <rect x="272" y="208" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="372" y="233">Gestión documental</text>
      <rect x="486" y="208" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="551" y="233">ML · NLP</text>
    </g>

    <!-- tarjeta decorativa: carpeta -->
    <rect x="900" y="66" width="210" height="188" rx="26" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="932" y="112" width="68" height="30" rx="10" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="932" y="130" width="146" height="94" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="952" y="154" width="86" height="8" rx="4" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="952" y="174" width="106" height="8" rx="4" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="952" y="194" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.30"/>
    <circle cx="1062" cy="100" r="7" fill="#22d3ee"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
