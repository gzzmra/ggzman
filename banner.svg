<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Mariana Guzmán — Gestión documental y tecnología</title>
<desc id="desc">Portada oscura con acentos rojos y una composición de información, documentos y tecnología.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#202124"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6747"/><stop offset="1" stop-color="#c92d13"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="330" rx="18" fill="url(#bg)"/>
<rect width="1200" height="330" rx="18" fill="url(#grid)"/>
<circle cx="1020" cy="150" r="140" fill="#e8401c" opacity=".15" filter="url(#glow)"/>
<path d="M0 286H1200" stroke="#e8401c" stroke-width="3" opacity=".9"/>
<rect x="58" y="54" width="7" height="190" rx="3" fill="url(#accent)"/>
<text x="92" y="91" fill="#e8401c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">PORTAFOLIO PROFESIONAL / 2026</text>
<text x="90" y="158" fill="#f4f1ec" font-family="Arial, sans-serif" font-size="57" font-weight="700">Mariana Guzmán</text>
<text x="93" y="199" fill="#d8d5d0" font-family="Arial, sans-serif" font-size="21">Gestión documental · Tecnología · Diseño de soluciones</text>
<text x="93" y="239" fill="#aaa7a2" font-family="Arial, sans-serif" font-size="15">Organizar información. Diseñar herramientas. Mejorar procesos.</text>
<!-- abstract information architecture -->
<g transform="translate(850 54)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="28" y="25" width="205" height="174" rx="12" stroke="#77736f" stroke-opacity=".65" stroke-width="1.5"/>
  <path d="M52 57H154M52 73H205M52 89H181" stroke="#8f8b86" stroke-width="5" opacity=".55"/>
