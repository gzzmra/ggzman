      <rect x="36" y="26" width="360" height="98" rx="22" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="216" y="77" font-size="40" font-weight="700" fill="#ffffff">2023</text>
      <text x="216" y="106" font-size="16" fill="#cbd5e1">Archivista desde</text>

      <rect x="420" y="26" width="360" height="98" rx="22" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="600" y="77" font-size="40" font-weight="700" fill="#ffffff">9</text>
      <text x="600" y="106" font-size="16" fill="#cbd5e1">Cursos y seminarios</text>

      <rect x="804" y="26" width="360" height="98" rx="22" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="984" y="77" font-size="40" font-weight="700" fill="#ffffff">3</text>
      <text x="984" y="106" font-size="16" fill="#cbd5e1">Proyectos</text>
