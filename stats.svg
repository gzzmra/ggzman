    <circle cx="200" cy="140" r="90" fill="#22d3ee" opacity="0.35" filter="url(#blur)"/>
    <circle cx="600" cy="10" r="90" fill="#f472b6" opacity="0.25" filter="url(#blur)"/>
    <circle cx="1000" cy="140" r="100" fill="#8b5cf6" opacity="0.45" filter="url(#blur)"/>

