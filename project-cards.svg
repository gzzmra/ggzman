<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Proyectos: resumen ejecutivo de contratos, manual e instructivos de archivo, clasificación automática de documentos" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Proyectos destacados</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <circle cx="190" cy="230" r="100" fill="#22d3ee" opacity="0.35" filter="url(#blur)"/>
    <circle cx="600" cy="0" r="100" fill="#f472b6" opacity="0.25" filter="url(#blur)"/>
    <circle cx="1010" cy="230" r="110" fill="#8b5cf6" opacity="0.45" filter="url(#blur)"/>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <!-- 01 -->
      <rect x="36" y="26" width="360" height="188" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="64" y="66" font-size="15" font-weight="700" fill="#22d3ee">01</text>
      <text x="64" y="104" font-size="23" font-weight="700" fill="#ffffff">Resumen ejecutivo</text>
      <text x="64" y="132" font-size="23" font-weight="700" fill="#ffffff">de contratos</text>
      <text x="64" y="170" font-size="15" fill="#cbd5e1">PHP · Diseño · Impresión y PDF</text>
      <rect x="64" y="186" width="56" height="4" rx="2" fill="url(#accent)"/>

      <!-- 02 -->
      <rect x="420" y="26" width="360" height="188" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="448" y="66" font-size="15" font-weight="700" fill="#22d3ee">02</text>
      <text x="448" y="104" font-size="23" font-weight="700" fill="#ffffff">Manual e instructivos</text>
      <text x="448" y="132" font-size="23" font-weight="700" fill="#ffffff">de archivo</text>
      <text x="448" y="170" font-size="15" fill="#cbd5e1">Gestión documental · Normativa</text>
      <rect x="448" y="186" width="56" height="4" rx="2" fill="url(#accent)"/>

      <!-- 03 -->
      <rect x="804" y="26" width="360" height="188" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <text x="832" y="66" font-size="15" font-weight="700" fill="#22d3ee">03</text>
      <text x="832" y="104" font-size="23" font-weight="700" fill="#ffffff">Clasificación automática</text>
      <text x="832" y="132" font-size="23" font-weight="700" fill="#ffffff">de documentos</text>
      <text x="832" y="170" font-size="15" fill="#cbd5e1">Tesis · Machine learning · NLP</text>
      <rect x="832" y="186" width="56" height="4" rx="2" fill="url(#accent)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
