<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Proyectos destacados</title>
<desc id="desc">Tres tarjetas que representan una herramienta de consulta de contratos, la estandarización de procesos de archivo y una investigación de clasificación automática.</desc>
<defs>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202124"/><stop offset="1" stop-color="#171819"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6747"/><stop offset="1" stop-color="#c92d13"/></linearGradient>
</defs>
<rect width="1200" height="270" rx="16" fill="#111214"/>
<!-- card 1 -->
<g transform="translate(12 12)">
 <rect width="376" height="246" rx="13" fill="url(#card)" stroke="#45413e"/>
 <text x="24" y="38" fill="#e8401c" font-family="monospace" font-size="13" letter-spacing="2">01 / DESARROLLO</text>
 <g transform="translate(27 62)" fill="none" stroke="#e8401c" stroke-width="2">
  <rect x="0" y="0" width="58" height="72" rx="5"/><path d="M12 17H46M12 29H46M12 41H39M12 54H32"/>
  <path d="M70 17H99M70 31H112M70 45H104" stroke="#77736f"/>
 </g>
 <text x="24" y="166" fill="#f4f1ec" font-family="Arial,sans-serif" font-size="21" font-weight="700">Consulta de contratos</text>
 <text x="24" y="193" fill="#aaa7a2" font-family="Arial,sans-serif" font-size="14">Datos estructurados en fichas</text>
 <text x="24" y="214" fill="#aaa7a2" font-family="Arial,sans-serif" font-size="14">claras y listas para consulta.</text>
</g>
<!-- card 2 -->
<g transform="translate(412 12)">
 <rect width="376" height="246" rx="13" fill="url(#card)" stroke="#45413e"/>
 <text x="24" y="38" fill="#e8401c" font-family="monospace" font-size="13" letter-spacing="2">02 / PROCESOS</text>
 <g transform="translate(28 63)" fill="none" stroke-width="2">
  <rect x="0" y="0" width="42" height="32" rx="5" stroke="#e8401c"/><rect x="70" y="0" width="42" height="32" rx="5" stroke="#77736f"/>
  <rect x="35" y="54" width="42" height="32" rx="5" stroke="#77736f"/>
  <path d="M42 16H70M56 32V54" stroke="#e8401c"/>
 </g>
 <text x="24" y="166" fill="#f4f1ec" font-family="Arial,sans-serif" font-size="21" font-weight="700">Procesos de archivo</text>
 <text x="24" y="193" fill="#aaa7a2" font-family="Arial,sans-serif" font-size="14">Procedimientos estandarizados</text>
 <text x="24" y="214" fill="#aaa7a2" font-family="Arial,sans-serif" font-size="14">para organizar y controlar.</text>
</g>
<!-- card 3 -->
<g transform="translate(812 12)">
 <rect width="376" height="246" rx="13" fill="url(#card)" stroke="#45413e"/>
 <text x="24" y="38" fill="#e8401c" font-family="monospace" font-size="13" letter-spacing="2">03 / INVESTIGACIÓN</text>
 <g transform="translate(28 61)" fill="none" stroke-width="2">
  <circle cx="16" cy="18" r="7" stroke="#e8401c"/><circle cx="58" cy="0" r="7" stroke="#77736f"/><circle cx="92" cy="30" r="7" stroke="#77736f"/><circle cx="48" cy="59" r="7" stroke="#e8401c"/>
  <path d="M22 15L52 3M64 5L87 25M86 36L54 56M42 54L19 24" stroke="#e8401c"/>
 </g>
 <text x="24" y="166" fill="#f4f1ec" font-family="Arial,sans-serif" font-size="21" font-weight="700">Clasificación automática</text>
 <text x="24" y="193" fill="#aaa7a2" font-family="Arial,sans-serif" font-size="14">Exploración de ML y NLP</text>
