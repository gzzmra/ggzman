<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <clipPath id="c"><rect width="900" height="300" rx="24"/></clipPath>
  <g clip-path="url(#c)">
  <rect width="900" height="300" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle r="120" fill="#7c5cff" opacity="0.75"><animate attributeName="cx" values="135.0;315.0;135.0" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="90.0;210.0;90.0" dur="14s" repeatCount="indefinite"/></circle>
