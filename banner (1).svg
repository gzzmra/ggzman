  <text x="450" y="226" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9ca3af">Archivista · CDMX</text>
  </g>
  <rect x=".6" y=".6" width="898.8" height="298.8" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
