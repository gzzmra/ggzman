    <circle r="90" fill="#f472b6" opacity="0.5"><animate attributeName="cx" values="450.0;630.0;450.0" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="270.0;150.0;270.0" dur="20s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="70" y="48" width="760" height="204" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="450" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#name)">Mariana Guzmán
